<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- vierport = janela de visualição, width=device-width = largura do dispositivo -->
    <meta name="author" content="Davino"> <!-- Informar aos navegadores, motores de buscas quem é o autor da página. -->
    <meta name="Keywords" content="cidade, Comunidade, Convite, Criatividade">
    <!-- Informar aos navegadores, motores de buscas palavras-chave relacionadas ao conteúdo da página. -->
    <meta name="discription" content="Around">
    <!-- Informar aos navegadores, motores de buscas uma breve descrição do conteúdo da página. -->
    <title>Around</title>
    <link rel="icon" type="images">
    <link rel="stylesheet" href="./pages/index.css">
</head>

<body>
    <div class="page">
        <header class="header">
            <img class="header__logo" src="./Nova pasta/Logotipo.svg">
        </header>
        <main class="main">
            <section class="profile">
                <div class="profile__person">
                    <img class="profile__img" alt="Jacques" src="./images/Jacques.jpg">
                    <div class="profile__info">
                        <div class="row">
                            <h1 class="profile__text-name">Jacques Cousteau</h1>
                            <button class="profile__edit-button">
                                <img alt="caneta" src="./images/Vector.png"></button>
                        </div>
                        <h3 class="profile__text-adj">Explorador</h3>
                    </div>
                </div>
                <button class="profile__add-button">
                    <img ald="add" src="./images/Vector (1).png">
                </button>
            </section>
            <section class="elements">
                <div class="elements__element">
                    <img class="element__img" alt="vale-de-Yosemite" src="./images/vale-de-Yosemite.jpg">
                    <div class="elements__element__white">
                        <h3 class="element__text">Vale de Yosemite</h3>
                        <img class="element__group-img" alt="coração de curtida" src="./images/curtida.svg">
                    </div>
                </div>
                <div class="elements__element">
                    <img src="./images/lago-louise.jpg" alt="lago Louise" class="element__img">
                    <div class="elements__element__white">
                        <h3 class="element__text">Lago Louise</h3>
                        <img src="./images/curtida.svg" alt="coração de curtida" class="element__group-img">
                    </div>
                </div>
                <div class="elements__element">
                    <img src="./images/montanhas-care.jpg" alt="montanhas Care" class="element__img">
                    <div class="elements__element__white">
                        <h3 class="element__text">Montanhas Care</h3>
                        <img src="./images/curtida.svg" alt="coração de curtida" class="element__group-img">
                    </div>
                </div>
                <div class="elements__element">
                    <img src="./images/latamar.jpg" alt="Latemar" class="element__img">
                    <div class="elements__element__white">
                        <h3 class="element__text">Latemar</h3>
                        <img src="./images/curtida.svg" alt="coração de curtida" class="element__group-img">
                    </div>
                </div>
                <div class="elements__element">
                    <img src="./images/parque-nacional.jpg" alt="parque nacional" class="element__img">
                    <div class="elements__element__white">
                        <h3 class="element__text">Parque Nacional</h3>
                        <img src="./images/curtida.svg" alt="coração de curtida" class="element__group-img">
                    </div>
                </div>
                <div class="elements__element">
                    <img src="./images/lago-di-braies.jpg" alt="lago di braies" class="element__img">
                    <div class="elements__element__white">
                        <h3 class="element__text">Lago di Braies</h3>
                        <img src="./images/curtida.svg" alt="coração de curtida" class="element__group-img">
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
